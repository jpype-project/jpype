[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "jpype1"
version = '1.7.2.dev0'
authors = [
    {name = "Steve Menard", email = "devilwolf@users.sourceforge.net"},
    {name = "Karl Einar Nelson", email = "thrameos@gmail.com"},
]
maintainers = [
    {name = "Martin K. Scherer", email = "martin.k.scherer@gmail.com"},
]
description = "A Python to Java bridge"
readme = "README.rst"
requires-python = ">=3.8"
license = "Apache-2.0"
classifiers = [
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Topic :: Software Development',
    'Topic :: Scientific/Engineering'
]
dependencies = [
    'packaging',
]


[project.optional-dependencies]

docs = [
    'sphinx',
    'sphinx-rtd-theme',
    'towncrier',
]
tests = [
    "pytest",
]


[project.entry-points.pyinstaller40]
"hook-dirs" = "jpype._pyinstaller.entry_points:get_hook_dirs"
"tests" = "jpype._pyinstaller.entry_points:get_PyInstaller_tests"


[project.urls]
homepage = "https://github.com/jpype-project/jpype"


[[tool.mypy.overrides]]
module = [
    "_jpype", # todo: add a proper _jpype.pyi file
    "commonx",
    "brokenx",
    "java.*",
    "jpypex.common",
    "jedi.*",
    "pandas",
    "dbutils.*",
]

ignore_missing_imports = true

[tool.pytest]
# pytest's built-in faulthandler plugin calls faulthandler.enable() before the
# JVM exists and faulthandler.disable() at exit, which reinstalls the pre-JVM
# SIGSEGV handler over HotSpot's.  The JVM then dies on the first armed
# safepoint poll during shutdown (random ~25% crash rate in CI).  Keep the
# plugin off; conftest.py enables faulthandler itself before startJVM.
addopts = ["--verbose", "-p", "no:faulthandler"]
testpaths = ["test", "jpype/_pyinstaller"]

[tool.coverage.run]
# Also measure Python subprocesses, such as the subrun.TestCase children that
# run tests in their own JVM.  Needs coverage 7.10+.
patch = ["subprocess"]


[tool.scikit-build]
build-dir = "build/{wheel_tag}"
build.verbose = true
logging.level = "INFO"
wheel.packages = ["jpype", "jpype._pyinstaller", "_jpype"]
# editable mode installs an import hook to redirect the extension and the python code.
# since this does not work for the JAR, CMake copies the JAR next to CMakelists.txt (root).
editable.mode = "redirect"
# todo: try out automatic rebuild feature.
#editable.rebuild = true

sdist.include = [
    "native/**/*.h",
    "native/**/*.xml",
    "native/**/*.java",
    "native/**/*.jar",
    "*.rst",
    "doc/*",
    "test/**",
    "org.jpype.jar",
]

sdist.exclude = [
    "test/classes/**",
    ".azure",
    ".github",
    "project/",
]
# keep debug info
cmake.build-type = "RelWithDebInfo"
install.strip = false

[tool.scikit-build.cmake.define]
ENABLE_BUILD_JAR = "OFF"
BUILD_TEST_HARNESS = "OFF"

# towncrier assembles doc/CHANGELOG.rst from the news fragments in
# doc/changes/.  See CONTRIBUTING.rst for usage.
[tool.towncrier]
directory = "doc/changes"
filename = "doc/CHANGELOG.rst"
template = "doc/changes/template.rst"
start_string = ".. towncrier release notes start\n"
issue_format = "`#{issue} <https://github.com/jpype-project/jpype/issues/{issue}>`__"
wrap = false
all_bullets = true
# The developer section's subdirectory, not a fragment (`towncrier check` is strict).
ignore = ["dev"]
# Fragments are named after a PR or issue number (or "+" for orphans).
issue_pattern = "\\d+"

# Sections: user-facing fragments go directly in doc/changes/, notes for people
# working on JPype itself (build, internals, CI) go in doc/changes/dev/.
[[tool.towncrier.section]]
name = ""
path = ""

[[tool.towncrier.section]]
name = "For developers"
path = "dev"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and removals"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = false
