name: Android

# Builds project/android/testapp (python-for-android via buildozer, x86_64),
# installs the APK on an API 34 emulator, and checks the on-device results
# printed by testapp/main.py (golden path, ported test/jpypetest suite,
# regression check for #1257).
#
# Two jobs on purpose: the APK build is slow (30-60+ minutes uncached), the
# emulator part is flaky by nature. "Re-run failed jobs" then only repeats the
# emulator job and reuses the uploaded APK.
#
# Caching: the dependency builds (hostpython3, python3, openssl, numpy, ...)
# take ~12 of the ~16 minutes and are cached in .buildozer. jpype1 itself is
# never served from the cache: p4a reuses an existing dist and installed
# packages without hashing recipe sources (doc/android_build.rst, "Stale
# rebuilds"), so the "Force a fresh jpype1 build" step deletes every jpype1
# artifact before each build, and "Check that jpype1 was rebuilt" fails the
# job if p4a skipped it anyway. The cache key has no restore-keys fallback:
# any change to the dependency inputs means a full cold build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project/android/**'
      - 'native/**'
      - 'jpype/**'
      - 'test/jpypetest/**'
      - '.github/workflows/android.yml'
  push:
    paths:
      - 'project/android/**'
      - 'native/**'
      - 'jpype/**'
      - 'test/jpypetest/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 25.1.8937393   # must match android.ndk in buildozer.spec
  APP_PACKAGE: org.jpype.test.jpypetest

jobs:
  build-apk:
    name: Build APK (python-for-android, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      # The harness was verified with JDK 21; a newer JDK breaks the bundled
      # Gradle wrapper ("Unsupported class file major version").
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system packages for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config cmake \
            autopoint gettext zlib1g-dev libncurses-dev libtinfo6 \
            libffi-dev libssl-dev rsync zip unzip git
          # The jpype1 recipe runs `ant -f test/build.xml javadoc`.
          ant -version

      # buildozer.spec hardcodes /home/kenelson/android-sdk. Point it at the
      # runner's preinstalled SDK instead, install the pinned NDK, and add the
      # legacy tools/bin/ symlinks that p4a/buildozer still look for
      # (doc/android_build.rst, "Setup").
      - name: Prepare Android SDK/NDK and patch buildozer.spec
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          sudo chown -R "$USER" "$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          sed -i \
            -e "s#^android.sdk_path *=.*#android.sdk_path = $SDK#" \
            -e "s#^android.ndk_path *=.*#android.ndk_path = $SDK/ndk/${ANDROID_NDK_VERSION}#" \
            -e "s#^android.api *=.*#&\nandroid.accept_sdk_license = True#" \
            project/android/testapp/buildozer.spec
          grep -n '^android\.' project/android/testapp/buildozer.spec

      # --system-site-packages is required: p4a runs `pip install --user`
      # internally, which pip refuses inside a plain venv.
      - name: Install buildozer
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/venv-android"
          "$RUNNER_TEMP/venv-android/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv-android/bin/pip" install buildozer cython
          echo "$RUNNER_TEMP/venv-android/bin" >> "$GITHUB_PATH"

      - name: Stage test/jpypetest into the test app
        run: python project/android/sync_tests.py

      # Everything that decides how the cached dependencies were built:
      # buildozer.spec (requirements, NDK, API levels), the local numpy
      # recipe, and the buildozer/p4a versions. buildozer clones p4a from
      # master, so its current commit goes into the key.
      - name: Compute Buildozer cache key
        id: bzkey
        run: |
          bz=$(pip show buildozer | awk '/^Version:/{print $2}')
          p4a=$(git ls-remote https://github.com/kivy/python-for-android.git refs/heads/master | cut -c1-12)
          test -n "$bz" && test -n "$p4a"
          echo "key=buildozer-deps-v1-bz$bz-p4a$p4a-${{ hashFiles('project/android/testapp/buildozer.spec', 'project/android/recipes/numpy/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            project/android/testapp/.buildozer
            ~/.buildozer
          key: ${{ steps.bzkey.outputs.key }}

      # The list from doc/android_build.rst ("Stale rebuilds"), plus
      # javaclasses (jpype1 copies its Java sources there; every recipe's
      # postbuild_arch refills it on each run) and the generated/ assets.
      # Harmless on a cold build, where none of it exists yet.
      - name: Force a fresh jpype1 build
        run: |
          B=project/android/testapp/.buildozer/android/platform/build-x86_64
          I="$B/build/python-installs/jpypetest/x86_64"
          rm -rf "$B/dists/jpypetest" \
                 "$B"/build/other_builds/jpype1-* \
                 "$B/build/javaclasses/jpypetest" \
                 "$I/jpype" "$I"/jpype1-*.dist-info "$I/_jpype.so" \
                 project/android/recipes/jpype1/generated

      - name: Build APK
        working-directory: project/android/testapp
        run: |
          set -eo pipefail
          buildozer -v android debug 2>&1 | tee "$RUNNER_TEMP/buildozer.log"
          ls -lh bin/

      - name: Check that jpype1 was rebuilt
        run: |
          L="$RUNNER_TEMP/buildozer.log"
          fail=0
          # A reused dist skips the whole build phase, so this line is then
          # missing. ("<dist> has compatible recipes, using this one" is no
          # signal: buildozer prints it in every build, after the dist exists.)
          if ! grep -q 'Building jpype1 for x86_64' "$L"; then
            echo "::error::p4a did not run jpype1's build (reused an existing dist?)"; fail=1
          fi
          if grep -q 'jpype1 said it is already built' "$L"; then
            echo "::error::p4a skipped compiling jpype1"; fail=1
          fi
          if ! grep -q 'Postbuilding jpype1 for x86_64' "$L"; then
            echo "::error::jpype1's postbuild step did not run"; fail=1
          fi
          if [ ! -s project/android/recipes/jpype1/generated/android-packages.txt ]; then
            echo "::error::recipes/jpype1/generated/ was not regenerated"; fail=1
          fi
          exit "$fail"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: jpypetest-apk
          path: project/android/testapp/bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-log
          path: ${{ runner.temp }}/buildozer.log
          if-no-files-found: ignore

  emulator-test:
    name: On-device jpypetest (API 34, x86_64 emulator)
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: project/android
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@v8
        with:
          name: jpypetest-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LOG: ${{ github.workspace }}/logcat.txt
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: bash project/android/ci_emulator_check.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logcat
          path: |
            logcat.txt*
            hang-diagnostics/
          if-no-files-found: ignore
