name: Android

# Builds project/android/testapp (python-for-android via buildozer, x86_64),
# installs the APK on an API 34 emulator, and checks the on-device results
# printed by testapp/main.py (golden path, ported test/jpypetest suite,
# regression check for #1257).
#
# Two jobs on purpose: the APK build is slow (30-60+ minutes uncached), the
# emulator part is flaky by nature. "Re-run failed jobs" then only repeats the
# emulator job and reuses the uploaded APK.
#
# No caching of .buildozer: doc/android_build.rst documents that p4a reuses
# stale jpype1 builds silently (no content hashing), so every run is a cold,
# honest build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project/android/**'
      - 'native/**'
      - 'jpype/**'
      - 'test/jpypetest/**'
      - '.github/workflows/android.yml'
  push:
    paths:
      - 'project/android/**'
      - 'native/**'
      - 'jpype/**'
      - 'test/jpypetest/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 25.1.8937393   # must match android.ndk in buildozer.spec
  APP_PACKAGE: org.jpype.test.jpypetest

jobs:
  build-apk:
    name: Build APK (python-for-android, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      # The harness was verified with JDK 21; a newer JDK breaks the bundled
      # Gradle wrapper ("Unsupported class file major version").
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system packages for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config cmake \
            autopoint gettext zlib1g-dev libncurses-dev libtinfo6 \
            libffi-dev libssl-dev rsync zip unzip git
          # The jpype1 recipe runs `ant -f test/build.xml javadoc`.
          ant -version

      # buildozer.spec hardcodes /home/kenelson/android-sdk. Point it at the
      # runner's preinstalled SDK instead, install the pinned NDK, and add the
      # legacy tools/bin/ symlinks that p4a/buildozer still look for
      # (doc/android_build.rst, "Setup").
      - name: Prepare Android SDK/NDK and patch buildozer.spec
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          sudo chown -R "$USER" "$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          sed -i \
            -e "s#^android.sdk_path *=.*#android.sdk_path = $SDK#" \
            -e "s#^android.ndk_path *=.*#android.ndk_path = $SDK/ndk/${ANDROID_NDK_VERSION}#" \
            -e "s#^android.api *=.*#&\nandroid.accept_sdk_license = True#" \
            project/android/testapp/buildozer.spec
          grep -n '^android\.' project/android/testapp/buildozer.spec

      # --system-site-packages is required: p4a runs `pip install --user`
      # internally, which pip refuses inside a plain venv.
      - name: Install buildozer
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/venv-android"
          "$RUNNER_TEMP/venv-android/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv-android/bin/pip" install buildozer cython
          echo "$RUNNER_TEMP/venv-android/bin" >> "$GITHUB_PATH"

      - name: Stage test/jpypetest into the test app
        run: python project/android/sync_tests.py

      - name: Build APK
        working-directory: project/android/testapp
        run: |
          set -eo pipefail
          buildozer -v android debug 2>&1 | tee "$RUNNER_TEMP/buildozer.log"
          ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: jpypetest-apk
          path: project/android/testapp/bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-log
          path: ${{ runner.temp }}/buildozer.log
          if-no-files-found: ignore

  emulator-test:
    name: On-device jpypetest (API 34, x86_64 emulator)
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jpypetest-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Kept as a file because android-emulator-runner executes `script:` line
      # by line, which is awkward for loops.
      - name: Write check script
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          APK=$(ls apk/*.apk | head -n1)
          ACTIVITY="$APP_PACKAGE/org.kivy.android.PythonActivity"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          
          # The unittest run is verbose; the default 256K logcat ring buffer
          # would drop most of it. Enlarge it and stream to a file.
          adb logcat -G 16M
          adb logcat -c
          adb logcat -v threadtime > "$LOG" &
          LOGCAT_PID=$!
          
          adb install -r "$APK" || exit 1
          adb shell am start -n "$ACTIVITY" || exit 1
          
          # Wait for the end marker from main.py (up to 30 minutes), or for the
          # app process to disappear without ever printing it.
          for i in $(seq 1 360); do
            if grep -q '=== jpype android testapp done ===' "$LOG"; then break; fi
            if [ "$i" -gt 12 ] && [ -z "$(adb shell pidof "$APP_PACKAGE" | tr -d '\r')" ]; then
              echo "app process is gone before the end marker appeared"
              break
            fi
            sleep 5
          done
          sleep 3
          kill "$LOGCAT_PID" 2>/dev/null || true
          
          fail=0
          check() {
            if grep -q "$1" "$LOG"; then echo "ok:   $1"; else echo "FAIL: missing '$1'"; fail=1; fi
          }
          check 'GOLDEN PATH: PASS'
          check 'REGRESSION CHECK #1257: PASS'
          check '=== jpype android testapp done ==='
          
          result=$(grep -o 'PORTED SUITE: ran=[0-9]* failures=[0-9]* errors=[0-9]* skipped=[0-9]*' "$LOG" | tail -n1)
          if [ -z "$result" ]; then
            echo "FAIL: no 'PORTED SUITE: ran=...' summary line"; fail=1
          else
            echo "$result"
            echo "$result" | grep -q 'failures=0 errors=0' || fail=1
          fi
          
          if grep -qE 'PORTED SUITE: (FAILED TO LOAD|FAIL to run)' "$LOG"; then
            grep -E 'PORTED SUITE: (FAILED TO LOAD|FAIL to run)' "$LOG"; fail=1
          fi
          # Signature of the original #1257 crash. The harmless trailing SIGABRT
          # from the WebView GPU thread (doc/android_build.rst) is not matched.
          if grep -q 'terminating due to uncaught exception' "$LOG"; then
            echo "FAIL: uncaught C++ exception in logcat"; fail=1
          fi
          
          {
            echo "### Android on-device result"
            echo '```'
            grep -hE 'GOLDEN PATH|PORTED SUITE: ran|REGRESSION CHECK' "$LOG" | sed 's/^.*python *: *//'
            echo '```'
          } >> "$SUMMARY"
          
          if [ "$fail" -ne 0 ]; then
            echo "---- failing/erroring tests ----"
            grep -E 'python *: (FAIL|ERROR)(:| )' "$LOG" | head -n 60
          fi
          exit "$fail"
          EOF

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LOG: ${{ github.workspace }}/logcat.txt
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          script: bash ${{ runner.temp }}/check.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: ignore