# Test the wheels produced by the Azure release pipeline (jpype.release).
#
# The release pipeline builds some platforms under QEMU emulation and only
# checks that the wheel imports.  This workflow downloads the exact wheels of
# one platform from an Azure build and runs the full test suite on a native
# GitHub-hosted runner, once per Python version found among the wheels and
# per JDK.  i686 has no runner of its own: it runs in the manylinux_2_28_i686
# container on an x86_64 runner, with that image's CPythons and its 32-bit
# JDK 11 (the jdk_versions input does not apply).
#
# Run it from the Actions tab ("Test release wheels" -> Run workflow).  It is
# also callable from other workflows (workflow_call).

name: Test release wheels

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Wheel platform to test"
        type: choice
        options:
          - manylinux_2_28_aarch64
          - manylinux_2_28_x86_64
          - manylinux_2_28_i686
        default: manylinux_2_28_aarch64
      azure_build_id:
        description: "Azure jpype.release build id (empty: newest build with wheels for the platform)"
        required: false
        default: ""
      branch:
        description: "With an empty build id, only consider builds of this branch (e.g. releases/1.8.0)"
        required: false
        default: ""
      jdk_versions:
        description: "JDK versions to test, as a JSON list"
        required: false
        default: '["11", "21"]'
  workflow_call:
    inputs:
      platform:
        type: string
        default: manylinux_2_28_aarch64
      azure_build_id:
        type: string
        default: ""
      branch:
        type: string
        default: ""
      jdk_versions:
        type: string
        default: '["11", "21"]'

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch ${{ inputs.platform }} wheels
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.fetch.outputs.build_id }}
      python: ${{ steps.fetch.outputs.python }}
      runner: ${{ steps.runner.outputs.runner }}
      container: ${{ steps.runner.outputs.container }}
    steps:
      - uses: actions/checkout@v6

      - id: fetch
        run: |
          python3 .github/scripts/fetch_azure_wheels.py \
            --platform "${{ inputs.platform }}" \
            --build-id "${{ inputs.azure_build_id }}" \
            --branch "${{ inputs.branch }}" \
            --out wheels --github-output "$GITHUB_OUTPUT"

      - id: runner
        run: |
          case "${{ inputs.platform }}" in
            *_aarch64) echo "runner=ubuntu-24.04-arm" >> "$GITHUB_OUTPUT" ;;
            *_x86_64)  echo "runner=ubuntu-24.04" >> "$GITHUB_OUTPUT" ;;
            *_i686)    echo "runner=ubuntu-24.04" >> "$GITHUB_OUTPUT"
                       echo "container=quay.io/pypa/${{ inputs.platform }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::No runner for ${{ inputs.platform }}"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/

  test:
    needs: fetch
    if: needs.fetch.outputs.container == ''
    runs-on: ${{ needs.fetch.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.fetch.outputs.python) }}
        jdk: ${{ fromJSON(inputs.jdk_versions) }}
    name: Python ${{ matrix.python }} / JDK ${{ matrix.jdk }} (build ${{ needs.fetch.outputs.build_id }})
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          version=$(ls wheels/jpype1-*.whl | head -n1 | sed -E 's/.*jpype1-([^-]+)-.*/\1/')
          # Pin the version and refuse the sdist, so pip fails instead of
          # silently falling back to a source build or an older PyPI release.
          python -m pip install --only-binary jpype1 --find-links wheels "jpype1==${version}"
          cd /tmp && python -c "import jpype, _jpype; print(jpype.__version__, _jpype.__file__)"

      - name: Install test requirements
        run: |
          # Some optional test dependencies may lack wheels for new or
          # prerelease Pythons; install what is available and let the
          # corresponding tests skip.
          if ! python -m pip install -r test-requirements.txt; then
            echo "::warning::Installing test requirements one by one"
            grep -vE '^\s*(#|$)' test-requirements.txt | while read -r req; do
              python -m pip install "$req" || echo "::warning::Could not install $req"
            done
          fi

      - name: Resolve Java test dependencies
        run: |
          wget -q --no-clobber "https://repo1.maven.org/maven2/org/apache/ivy/ivy/2.5.3/ivy-2.5.3.jar" -P lib
          java -jar lib/ivy-2.5.3.jar -ivy ivy.xml -retrieve 'lib/[artifact]-[revision](-[classifier]).[ext]'

      - name: Build test harness
        run: |
          sudo apt-get update && sudo apt-get install -y ant gdb
          ant -f test/build.xml

      - name: Run test suite
        run: |
          ulimit -c unlimited
          echo "core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
          # Run from test/ so the source tree's jpype/ does not shadow the wheel.
          cd test
          python -m pytest -v --junit-xml=test.xml jpypetest --checkjni -n2 --dist loadfile

      - name: Backtrace on crash
        if: failure()
        run: |
          core=$(ls test/core.* 2>/dev/null | head -n1 || true)
          if [ -n "$core" ]; then gdb -batch -ex "thread apply all bt" "$(which python)" "$core"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python }}-jdk${{ matrix.jdk }}
          path: test/test.xml

  # Platforms without a native runner (i686): run in the manylinux container.
  # GitHub's own actions cannot run inside a 32-bit container, so the job
  # starts it with docker run instead of using "container:".
  test-container:
    needs: fetch
    if: needs.fetch.outputs.container != ''
    runs-on: ${{ needs.fetch.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.fetch.outputs.python) }}
    name: Python ${{ matrix.python }} / JDK 11 (${{ inputs.platform }}, build ${{ needs.fetch.outputs.build_id }})
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels

      - name: Run test suite in ${{ needs.fetch.outputs.container }}
        run: |
          echo "core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
          docker run --rm -v "$PWD:/io" "${{ needs.fetch.outputs.container }}" \
            /io/.github/scripts/test-in-manylinux.sh "${{ matrix.python }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ inputs.platform }}-py${{ matrix.python }}
          path: test/test.xml
