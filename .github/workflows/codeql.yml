name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "27 1 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ java, cpp, python ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          # AlertSuppression.ql turns in-source `codeql[<query-id>]` comments
          # into SARIF suppressions, which the dismiss step below acts on.
          packs: codeql/${{ matrix.language }}-queries:AlertSuppression.ql
          config: |
            paths-ignore:
              - "test/**"

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        if: ${{ matrix.language == 'python' }}

      - name: Build cpp
        run: |
          pip install scikit-build-core
          pip install . --verbose --no-build-isolation
        if: ${{ matrix.language == 'cpp' }}

      - name: Build java
        run: ant -f native/build.xml
        if: ${{ matrix.language == 'java' }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      # Code scanning ignores SARIF `suppressions`, so alerts marked by the
      # AlertSuppression.ql pack stay open. This dismisses them ("won't fix",
      # "Suppressed via SARIF") and reopens them once the comment is removed.
      # Dismissal state is repository-wide, so only act on master.
      - name: Dismiss alerts suppressed in source
        if: github.ref == 'refs/heads/master'
        uses: advanced-security/dismiss-alerts@v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ github.token }}
