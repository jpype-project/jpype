# This template installs the requested Python version, build tools and sets up dependency caching.
parameters:
- name: version
  type: string
  default: '3.12'

- name: architecture
  type: string
  default: 'x64'

- name: githubToken
  type: string
  default: ''

steps:
  - task: UsePythonVersion@0
    inputs:
      architecture: ${{ parameters.architecture }}
      versionSpec: ${{ parameters.version }}
      disableDownloadFromRegistry: false # boolean. Disable downloading releases from the GitHub registry. Default: false.
      allowUnstable: true # boolean. Optional. Use when disableDownloadFromRegistry = false. Allow downloading unstable releases. Default: false.
      githubToken: ${{ parameters.githubToken }} # Token allowing API access to Github (for not hitting a rate limit while downloading).
    env:
      # Explicitly map it to an ENV variable for the task process
      GITHUB_TOKEN: ${{ parameters.githubToken }}
  - bash: |
      echo AGENT_JOBSTATUS = $AGENT_JOBSTATUS
      if [[ "$AGENT_JOBSTATUS" == "SucceededWithIssues" ]]; then exit 1; fi
    displayName: Python ${{ parameters.version }} set as interpreter.

  - task: Cache@2
    continueOnError: true
    inputs:
      key: |
        python | "$(Agent.OS)" | pyproject.toml | test-requirements.txt
      path: $(UV_CACHE_DIR)
    displayName: "restore uv cache"

  - script: |
      pip install uv
    displayName: install uv

  # Free-threaded builds cannot be selected through UsePythonVersion (its architecture input only knows x86/x64/arm64).
  # uv provides them ('3.14t'); the seeded virtual environment is put first on PATH, so that `python`, `pip` and
  # `python -m uv` in all later steps refer to the free-threaded interpreter. Requires UV_SYSTEM_PYTHON=0 for the job,
  # because uv ignores virtual environments when UV_SYSTEM_PYTHON=1.
  - bash: |
      uv python install '${{ parameters.version }}t'
      uv venv --seed --python '${{ parameters.version }}t' "$(Pipeline.Workspace)/ftvenv"
      if [ -d "$(Pipeline.Workspace)/ftvenv/Scripts" ]; then BIN=Scripts; else BIN=bin; fi
      echo "##vso[task.prependpath]$(Pipeline.Workspace)/ftvenv/$BIN"
      "$(Pipeline.Workspace)/ftvenv/$BIN/python" -m pip install uv
    condition: eq(variables['python.freethreaded'], 'true')
    displayName: Free-threaded Python ${{ parameters.version }}t via uv
