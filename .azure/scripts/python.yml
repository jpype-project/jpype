# This template installs the requested Python version, build tools and sets up dependency caching.
parameters:
- name: version
  type: string
  default: '3.12'

- name: architecture
  type: string
  default: 'x64'

- name: githubToken
  type: string
  default: ''

steps:
  # Python 3.8 and 3.9 are no longer in the actions/python-versions registry
  # that UsePythonVersion downloads from.  For those, UsePythonVersion only
  # provides a bootstrap interpreter, and uv creates a venv with a uv-managed
  # (python-build-standalone) interpreter of the requested version.
  - bash: |
      case "${{ parameters.version }}" in
        3.8|3.9)
          echo "##vso[task.setvariable variable=jpype.legacyPython]true"
          echo "##vso[task.setvariable variable=jpype.pythonSpec]3.12" ;;
        *)
          echo "##vso[task.setvariable variable=jpype.legacyPython]false"
          echo "##vso[task.setvariable variable=jpype.pythonSpec]${{ parameters.version }}" ;;
      esac
    displayName: Select Python ${{ parameters.version }} source

  - task: UsePythonVersion@0
    inputs:
      architecture: ${{ parameters.architecture }}
      versionSpec: $(jpype.pythonSpec)
      disableDownloadFromRegistry: false # boolean. Disable downloading releases from the GitHub registry. Default: false.
      allowUnstable: true # boolean. Optional. Use when disableDownloadFromRegistry = false. Allow downloading unstable releases. Default: false.
      githubToken: ${{ parameters.githubToken }} # Token allowing API access to Github (for not hitting a rate limit while downloading).
    env:
      # Explicitly map it to an ENV variable for the task process
      GITHUB_TOKEN: ${{ parameters.githubToken }}
  - bash: |
      echo AGENT_JOBSTATUS = $AGENT_JOBSTATUS
      if [[ "$AGENT_JOBSTATUS" == "SucceededWithIssues" ]]; then exit 1; fi
    displayName: Python $(jpype.pythonSpec) set as interpreter.

  - bash: |
      set -e
      python -m pip install uv
      VENV="$(Agent.TempDirectory)/python-${{ parameters.version }}"
      python -m uv venv --seed --python "${{ parameters.version }}" "$VENV"
      # Put the venv first on PATH and make uv install into it: with
      # UV_SYSTEM_PYTHON set, uv would skip the venv and pick another interpreter.
      python - "$VENV" <<'EOF'
      import os, sys
      venv = os.path.abspath(sys.argv[1])
      print("##vso[task.prependpath]" + os.path.join(venv, "Scripts" if os.name == "nt" else "bin"))
      print("##vso[task.setvariable variable=VIRTUAL_ENV]" + venv)
      print("##vso[task.setvariable variable=UV_SYSTEM_PYTHON]false")
      EOF
    condition: and(succeeded(), eq(variables['jpype.legacyPython'], 'true'))
    displayName: Python ${{ parameters.version }} via uv

  - bash: |
      python -c "import sys; print(sys.version); print(sys.executable)"
      python -c "import sys; v = '${{ parameters.version }}'; sys.exit(0 if v.count('.') != 1 or '%d.%d' % sys.version_info[:2] == v else 'wrong Python: ' + sys.version)"
    displayName: Check Python ${{ parameters.version }}

  # Skipped on Windows: saving the cache there crashes the agent's tar
  # (exit 0xC0000005 / -1073741819) whenever a new cache has to be saved,
  # which fails the job each time the cache key changes.
  - task: Cache@2
    condition: ne(variables['Agent.OS'], 'Windows_NT')
    inputs:
      key: |
        python | "$(Agent.OS)" | pyproject.toml | test-requirements.txt
      path: $(UV_CACHE_DIR)
    displayName: "restore uv cache"

  - script: |
      pip install uv
    displayName: install uv
