# This template installs the requested Python version, build tools and sets up dependency caching.
parameters:
- name: version
  type: string
  default: '3.12'

- name: architecture
  type: string
  default: 'x64'

- name: githubToken
  type: string
  default: ''

steps:
  - task: UsePythonVersion@0
    inputs:
      architecture: ${{ parameters.architecture }}
      versionSpec: ${{ parameters.version }}
      disableDownloadFromRegistry: false # boolean. Disable downloading releases from the GitHub registry. Default: false.
      allowUnstable: true # boolean. Optional. Use when disableDownloadFromRegistry = false. Allow downloading unstable releases. Default: false.
      githubToken: ${{ parameters.githubToken }} # Token allowing API access to Github (for not hitting a rate limit while downloading).
    env:
      # Explicitly map it to an ENV variable for the task process
      GITHUB_TOKEN: ${{ parameters.githubToken }}
  - bash: |
      echo AGENT_JOBSTATUS = $AGENT_JOBSTATUS
      if [[ "$AGENT_JOBSTATUS" == "SucceededWithIssues" ]]; then exit 1; fi
    displayName: Python ${{ parameters.version }} set as interpreter.

  # On Windows the agent saves the cache with `tar -h` (follow links), using the
  # bsdtar shipped in System32. That tar crashes (exit 0xC0000005) on the uv
  # cache, presumably on the directory junctions uv creates there, whenever a
  # new cache has to be saved. Point the agent at Git for Windows' GNU tar
  # instead; it reads VSTS_TAR_EXECUTABLE. Restore keeps using 7-Zip.
  - bash: |
      set -e
      tar_exe="$(cygpath -w /usr/bin/tar)"
      "$tar_exe" --version | head -1
      echo "##vso[task.setvariable variable=VSTS_TAR_EXECUTABLE]$tar_exe"
    condition: eq(variables['Agent.OS'], 'Windows_NT')
    displayName: Use GNU tar for the pipeline cache

  - task: Cache@2
    inputs:
      key: |
        python | "$(Agent.OS)" | pyproject.toml | test-requirements.txt
      path: $(UV_CACHE_DIR)
    displayName: "restore uv cache"

  - script: |
      pip install uv
    displayName: install uv
