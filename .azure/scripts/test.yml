# This task tests individual platforms and versions

parameters:
- name: PIP_CACHE_DIR
  type: string
  default: $(PIP_CACHE_DIR)

- name: githubToken
  type: string

steps:

- template: python.yml
  parameters:
    version: '$(python.version)'
    githubToken: ${{ parameters.githubToken }}

- template: jdk.yml
  parameters:
    version: '$(jdk.version)'

- script: |
    pip install build
    python -m build --sdist
  displayName: 'Create source distribution'

- script: |
    # avoid shell globbing, because we have Windows...
    python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'uv', 'pip', 'install', '-v', glob.glob('dist/*.tar.gz')[0]])"
    cd ..
    python -c "import jpype"
  displayName: 'Build/install/check module'
  env:
    CMAKE_ARGS: $(CMAKE_ARGS)

# On a free-threaded interpreter, importing an extension without the free-threading declaration silently re-enables
# the global interpreter lock; this also fails loudly if the job ended up on the wrong (regular) interpreter.
- bash: |
    python -c "import sys, jpype; assert not sys._is_gil_enabled(), 'global interpreter lock is enabled'"
  workingDirectory: $(Agent.TempDirectory)
  condition: eq(variables['python.freethreaded'], 'true')
  displayName: 'Verify the global interpreter lock stays off'

- bash: |
    # Create a temporary requirements file without the packages that cannot be installed on this leg:
    # - skip_numpy: numpy and anything that hard-depends on it (e.g. pandas), so this leg
    #   actually exercises jpype's numpy-optional code paths.
    # - free-threaded legs: polars, because it is not installable there (no wheel is selected and the
    #   fallback source build fails). numpy and pandas stay, as they provide free-threaded wheels.
    EXCLUDE=""
    if [ "${SKIP_NUMPY:-false}" = "true" ]; then
      EXCLUDE="numpy|pandas"
    elif [ "${PYTHON_FREETHREADED:-false}" = "true" ]; then
      EXCLUDE="polars"
    fi
    if [ -n "$EXCLUDE" ]; then
      grep -vE "^($EXCLUDE)$" test-requirements.txt > test-requirements-filtered.txt
      uv pip install -r test-requirements-filtered.txt
    else
      uv pip install -r test-requirements.txt
    fi
  displayName: 'Install test requirements'
  env:
    SKIP_NUMPY: $(skip_numpy)
    PYTHON_FREETHREADED: $(python.freethreaded)

# building the harness from a source dist via cmake does work!
- bash: |
    ant -f test/build.xml
  displayName: build test harness

# --- LINUX ONLY: Prepare core dump environment ---
- script: |
    sudo apt-get update && sudo apt-get install -y gdb
    echo "core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
  displayName: 'Setup Linux Core Dumps'
  condition: eq(variables['Agent.OS'], 'Linux' )

# cd to test first, so avoid to import jpype from the project working dir.
- bash: |
    [ "$(Agent.OS)" = "Linux" ] && ulimit -c unlimited
    cd test
    if [ "${PYTHON_FREETHREADED:-false}" = "true" ]; then
      # Free-threaded runs use one process with several threads: this is the
      # only mode in which pytest-run-parallel exercises the real races.
      # Keep the count at or below the runner's CPU count (capped at 4) so a
      # hosted agent is not oversubscribed; local stress runs can use more
      # through JPYPETEST_PARALLEL_THREADS.
      if ! python -c 'import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("pytest_run_parallel") is not None else 1)'; then
        echo "pytest-run-parallel is required for the free-threaded test legs"
        exit 1
      fi
      THREADS="${JPYPETEST_PARALLEL_THREADS:-$(python -c 'import os; print(min(os.cpu_count() or 4, 4))')}"
      PYTEST_FLAGS=(-n1 --parallel-threads="$THREADS" --dist loadfile)
      RUNS="${JPYPETEST_RUNS:-3}"
    else
      PYTEST_FLAGS=(-n2 --dist loadfile)
      # pytest-run-parallel requires Python 3.10+, so the 3.8/3.9 legs have
      # neither the plugin nor its option; there each xdist worker is serial.
      if python -c 'import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("pytest_run_parallel") is not None else 1)'; then
        PYTEST_FLAGS+=(--parallel-threads=1)
      fi
      RUNS=1
    fi
    if [ "${JPYPETEST_FAST:-false}" = "true" ]; then
      PYTEST_FLAGS+=(--fast)
    fi
    # pytest-randomly reshuffles the order for every pass.  Run the free-threaded
    # legs several times so an interleaving has to be stable, not lucky.
    status=0
    for run in $(seq 1 "$RUNS"); do
      echo "=== pytest run $run/$RUNS, flags: ${PYTEST_FLAGS[*]} ==="
      python -m pytest -v --junit-xml=test.xml "${PYTEST_FLAGS[@]}" jpypetest --checkjni || status=$?
      if [ "$status" -ne 0 ]; then
        echo "pytest run $run failed"
        break
      fi
    done
    exit "$status"
  displayName: 'Test JDK $(jdk.version) and Python $(python.version)'
  env:
    PYTHON_FREETHREADED: $(python.freethreaded)
    JPYPETEST_FAST: $(jpypetest.fast)

# --- LINUX ONLY: Extract Backtrace if a crash occurred ---
- script: |
    CORE_FILE=$(ls test/core.* core.* 2>/dev/null | head -n 1)
    if [ -n "$CORE_FILE" ]; then
      echo "##vso[task.logissue type=error]Linux Crash Detected! Extracted Stacktrace:"
      gdb -batch -ex "thread apply all bt" $(which python) "$CORE_FILE"
    fi
  displayName: 'Linux Post-Mortem Debug'
  condition: and(failed(), eq(variables['Agent.OS'], 'Linux'))

# presence of jpype/ seems to confuse entry_points so `cd` elsewhere
- script: |
    #uv pip install . # is already installed via sdist+pip install
    mkdir empty
    cd empty
    python -m PyInstaller.utils.run_tests --include_only jpype._pyinstaller.
  displayName: 'Test PyInstaller result'
  condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'), eq(variables['python.version'], '3.10'))

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
     testResultsFiles: 'test/test.xml'
     testRunTitle: 'Publish test results for Python $(python.version) with JDK $(jdk.version)'
