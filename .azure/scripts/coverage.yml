# This task produces the coverage reports and publishes them to codecov.
steps:
- template: python.yml

- template: jdk.yml
  parameters:
    version: 11

- script: |
    uv pip install gcovr pytest-cov -r test-requirements.txt numpy
  displayName: 'Install requirements'

- script: |
    pip install -e . --config-setting cmake.args="-DENABLE_COVERAGE=ON" -vv
  displayName: 'Build'

- script: |
    ant -f test
  displayName: 'Build java tests'

- script: |
    python -m pytest -v -s test/jpypetest --junit-xml=test_coverage.xml --cov=jpype --cov-report=xml:coverage_py.xml --classpath="native/build/classes" --jacoco --checkjni
  displayName: 'Test'

- script: |
    gcovr -r . --xml -o coverage.xml --exclude-unreachable-branches --exclude-throw-branches  --gcov-ignore-parse-errors=negative_hits.warn
    java -jar lib/org.jacoco.cli-0.8.5-nodeps.jar report build/coverage/jacoco.exec --classfiles native/build/classes --xml coverage_java.xml --sourcefiles native/jpype_module/src/main/java
  displayName: 'Report'

- template: codecov-upload.yml
  parameters:
    files: [coverage.xml, coverage_py.xml, coverage_java.xml]
    flag: coverage
    displayName: 'Upload coverage to Codecov'

- task: PublishCodeCoverageResults@2
  inputs:
    codeCoverageTool: 'JaCoCo'
    summaryFileLocation: coverage_java.xml
    pathToSources: $(System.DefaultWorkingDirectory)/native/jpype_module/src/main/java

- task: PublishCodeCoverageResults@2
  inputs:
    codeCoverageTool: 'cobertura'
    summaryFileLocation: coverage.xml

- task: PublishCodeCoverageResults@2
  inputs:
    codeCoverageTool: 'cobertura'
    summaryFileLocation: coverage_py.xml

- template: codecov-upload.yml
  parameters:
    reportType: test_results
    files: [test_coverage.xml]
    flag: coverage
    condition: succeededOrFailed()
    displayName: 'Upload test results to Codecov'
