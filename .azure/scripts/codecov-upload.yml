# Uploads reports (coverage or JUnit XML test results) to Codecov.
#
# The upload never fails the job itself: a Codecov outage must not turn
# a green build red.
#
# The CLI's default plugins are disabled (--plugin noop): the pycoverage plugin
# would regenerate coverage.xml in the working directory and thereby overwrite
# the gcovr report of the C++ sources with Python coverage.
#
# codecov-cli is run through uv with a pinned interpreter, so it does not
# depend on the Python version under test (which may be a pre-release without
# wheels for the CLI's dependencies).
parameters:
- name: files
  type: object

- name: flag
  type: string

- name: reportType
  type: string
  default: coverage
  values:
  - coverage
  - test_results

# Test results are worth uploading after failed tests; coverage reports are
# only produced when the tests passed.
- name: condition
  type: string
  default: succeeded()

- name: displayName
  type: string
  default: 'Upload to Codecov'

steps:
- bash: |
    python -m uv tool run --python 3.12 --from codecov-cli \
      codecovcli do-upload \
        --report-type '${{ parameters.reportType }}' \
        --file ${{ join(' --file ', parameters.files) }} \
        --flag '${{ parameters.flag }}' \
        --disable-search \
        --plugin noop
  displayName: ${{ parameters.displayName }}
  condition: ${{ parameters.condition }}
  continueOnError: true
