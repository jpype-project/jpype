# This job creates wheels for Windows/OSX
steps:
- script: |
    mkdir -p dist
    uv pip install --upgrade pip -r test-requirements.txt
  displayName: 'Install dependencies'

- script: |
    uv pip wheel . -w wheelhouse/
  displayName: 'Build wheel'

- script: |
    ls -lh wheelhouse
    cp wheelhouse/$(package_name)* dist/.
  displayName: 'Show wheelhouse'

- script: |
    uv pip install jpype1 --no-index -f wheelhouse
  displayName: 'Install module'

- bash: |
    python -c "import sys, jpype; assert not sys._is_gil_enabled(), 'global interpreter lock is enabled'"
  workingDirectory: $(Agent.TempDirectory)
  condition: eq(variables['python.freethreaded'], 'true')
  displayName: 'Verify the global interpreter lock stays off'

- script: |
    ant -f test
  displayName: 'Build java tests'

- script: |
    ls -l
    ls lib/
  displayName: 'Check deps'

- task: PublishPipelineArtifact@0
  inputs:
    artifactName: 'artifact_$(Agent.JobName)_$(Agent.OS)_$(python.architecture)'
    targetPath: 'dist'

- script: |
    rm -Rf jpype
    python -m pytest -v --junit-xml=build/test/test.xml test/jpypetest --checkjni --fast
  displayName: 'Test module'

