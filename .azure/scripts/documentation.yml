# This task tries to verify if the documentation will build properly on RTD
steps:
- template: python.yml

- script: |
    uv pip install -r test-requirements.txt -r .azure/doc-requirements.txt
  displayName: 'Install requirements'

# Render all news fragments, including this PR's, into doc/CHANGELOG.rst as
# an "unreleased" section, so the documentation artifact shows them and the
# -W build below fails on a fragment with broken RST.  --keep leaves the
# fragments in place; the edit only exists in this CI checkout.
- script: |
    set -e
    uv pip install towncrier
    # Current version from jpype/__init__.py (e.g. 1.7.2.dev0), used as the
    # section heading: "1.7.2.dev0 (unreleased) - <today>".
    version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('jpype/__init__.py').read())[1])")
    # Insert the rendered fragments below ".. towncrier release notes start"
    # in doc/CHANGELOG.rst; --keep means: no prompt, do not delete fragments.
    towncrier build --keep --version "$version (unreleased)"
  displayName: 'Render news fragments into the changelog'

- script: |
    python -m sphinx -T -b html -d _build/doctrees-readthedocs -D language=en -W doc build/html
  displayName: 'Check documentation'

- task: CopyFiles@2
  inputs:
    contents: 'build/html/**'
    targetFolder: $(Build.ArtifactStagingDirectory)

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)
    artifactName: documentation

