# This task tries to verify if the documentation will build properly on RTD
steps:
- template: python.yml

- script: |
    uv pip install -r test-requirements.txt -r .azure/doc-requirements.txt
  displayName: 'Install requirements'

- script: |
    python -m sphinx -T -b html -d _build/doctrees-readthedocs -D language=en -W doc build/html
  displayName: 'Check documentation'

- task: CopyFiles@2
  inputs:
    contents: 'build/html/**'
    targetFolder: $(Build.ArtifactStagingDirectory)

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)
    artifactName: documentation

