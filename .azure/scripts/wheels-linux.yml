steps:

- task: DownloadPipelineArtifact@2
  inputs:
    source: current
    artifact: artifact_SourceDistribution
    path: dist

- script: |
    docker run --rm --privileged tonistiigi/binfmt --install all
  condition: and(succeeded(), ne(variables['arch'], 'x86_64'), ne(variables['arch'], 'i686'))
  displayName: 'Install QEMU'

- script: |
    ls -l
    ls -l dist
  displayName: Sanity check 

- script: |
    set -ex
    # Use the agent's resolver: inside Docker's default bridge network the
    # i686 job could not resolve vault.almalinux.org (builds 2475 and 2481).
    docker run --network host \
      -e PLAT=$(plat) \
      -e package_name=$(package_name) \
      -e BUILD_PY_VERSIONS="$(build_py_versions)" \
      -e SKBUILD_WHEEL_BUILD_TAG="$(SKBUILD_WHEEL_BUILD_TAG)" \
      --rm -v `pwd`:/io $(image) /io/.azure/scripts/build-wheels.sh
  displayName: Build wheels

- script: |
    ls -lh wheelhouse/
    rm dist/*
    cp wheelhouse/$(package_name)*.whl dist/.
  displayName: Copy wheels
